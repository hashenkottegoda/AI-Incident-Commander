name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    # Matches docker-compose.yml's dev-only Postgres credentials (and
    # backend/config.py's default) so the app/Alembic connect to the
    # service container below without any extra setup.
    #
    # OPENROUTER_API_KEY is required with no default (backend/config.py's
    # Settings fails fast at import time otherwise). tests/conftest.py sets
    # the same dummy value via os.environ.setdefault(...) before any test
    # module import, but the "Apply database migrations" step invokes
    # alembic directly as its own process, so conftest.py never runs and
    # Settings validation fails without it here too.
    env:
      DATABASE_URL: postgresql+psycopg://incident_commander:incident_commander@localhost:5432/incident_commander
      OPENROUTER_API_KEY: sk-test-dummy

    # Matches docker-compose.yml's postgres service (same dev-only
    # credentials) so tests/test_db.py exercises real Postgres in CI
    # instead of always skipping.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: incident_commander
          POSTGRES_PASSWORD: incident_commander
          POSTGRES_DB: incident_commander
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incident_commander -d incident_commander"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Provision LangGraph checkpoint tables
        run: uv run python -m backend.scripts.setup_checkpointer

      - name: Test (pytest)
        run: uv run pytest

  frontend-lint-and-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Build (tsc + vite build)
        run: npm run build
