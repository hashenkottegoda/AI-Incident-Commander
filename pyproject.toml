[project]
name = "ai-incident-commander"
version = "0.1.0"
description = "Agentic system for investigating simulated production incidents with LangGraph-orchestrated diagnosis and human-approved remediation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.35",
    "psycopg[binary]>=3.2.3",
    "alembic>=1.13.3",
    "langgraph>=0.2.45",
    "langchain-anthropic>=0.3.0",
    "langgraph-checkpoint-postgres>=2.0.1",
    "qdrant-client>=1.12.0",
    "sentence-transformers>=3.2.1",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    # Direct (not just transitive via sentence-transformers) so the
    # `[tool.uv.sources]` CPU-wheel-index pin below reliably applies -- see
    # that section's comment.
    "torch>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.1",
    "httpx>=0.27.2",
]

# `sentence-transformers` pulls in `torch`, whose default PyPI Linux wheel
# depends on a dozen separate `nvidia-*` CUDA packages (several GB) even
# though the embedding pipeline is CPU-only (see backend/rag/embeddings.py
# and BUILD_PLAN.md's "local sentence-transformers by default" rationale).
# Without this, `docker compose build` (python:3.12-slim, no GPU) pulls the
# full CUDA runtime for nothing and is prone to timing out on the largest
# downloads (e.g. nvidia-cublas, nvidia-cudnn). Pin `torch` to PyPI's
# CPU-only wheel index instead, which has no `nvidia-*` dependencies.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
