[project]
name = "ai-incident-commander"
version = "0.1.0"
description = "Agentic system for investigating simulated production incidents with LangGraph-orchestrated diagnosis and human-approved remediation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.35",
    "psycopg[binary]>=3.2.3",
    "alembic>=1.13.3",
    "langgraph>=0.2.45",
    "langchain-anthropic>=0.3.0",
    "langgraph-checkpoint-postgres>=2.0.1",
    "qdrant-client>=1.12.0",
    "sentence-transformers>=3.2.1",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.1",
    "httpx>=0.27.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
